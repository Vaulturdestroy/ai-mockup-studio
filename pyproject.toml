[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ai-mockup-studio"
version = "0.6.2"
description = "AI product mockup generator — pipeline for turning product photos and spec sheets into studio-grade mockups."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ai-mockup-studio contributors" }]
keywords = ["mockup", "product-photography", "diffusion", "sdxl", "compositing", "desktop"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3.11",
  "Topic :: Multimedia :: Graphics",
]

dependencies = [
  "Pillow>=10.3",
  "numpy>=1.26",
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  "onnxruntime>=1.18; platform_system=='Windows'",
  "onnxruntime-directml>=1.18; platform_system=='Windows'",
]

[project.optional-dependencies]
torch = ["torch>=2.3", "diffusers>=0.29", "transformers>=4.41"]
blender = ["bpy>=4.1"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5", "black>=24.4", "mypy>=1.10"]

[project.scripts]
mockup-studio = "mockup_studio.cli:app"

[project.urls]
Homepage = "https://github.com/ai-mockup-studio/ai-mockup-studio"
Issues = "https://github.com/ai-mockup-studio/ai-mockup-studio/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mockup_studio"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]